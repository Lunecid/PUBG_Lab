name: Code quality

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  structure-and-packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-quality.txt
      - run: make structure format-check lint test-architecture
      - run: make wheel
